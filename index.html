<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Resources</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 15px; }
    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 5px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #1e293b; color: #94a3b8; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #334155; }
    .card img { width: 100%; height: 110px; object-fit: cover; background: #334155; }
    .card-content { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .card-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; }
    .coins { font-size: 12px; color: #facc15; font-weight: bold; }
    .btn-get { background: #38bdf8; color: #0f172a; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; }
    #loading { text-align: center; padding: 40px; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>💎 প্রিমিয়াম রিসোর্স</h1>
    <p style="font-size: 12px; color: #94a3b8;">পছন্দের ফন্ট ও PLP সংগ্রহ করুন</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('font')">🔤 ফন্ট</button>
    <button class="tab-btn" onclick="switchTab('plp')">🎨 PLP ফাইল</button>
  </div>

  <div id="loading">লোড হচ্ছে...</div>
  <div class="grid" id="resourceGrid"></div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const FIREBASE_URL = "https://premium-resources-default-rtdb.firebaseio.com/resources.json";
    let allResources = {};
    let currentTab = 'font';

    async function fetchResources() {
      try {
        const res = await fetch(FIREBASE_URL);
        const data = await res.json();
        allResources = data || {};
        renderResources();
      } catch (e) {
        document.getElementById('loading').innerText = "ডাটা লোড হতে সমস্যা হয়েছে!";
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderResources();
    }

    function renderResources() {
      const container = document.getElementById('resourceGrid');
      const loading = document.getElementById('loading');
      container.innerHTML = '';
      loading.style.display = 'none';

      const keys = Object.keys(allResources).filter(k => allResources[k].type === currentTab);

      if (keys.length === 0) {
        container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: #64748b; padding: 30px;">কোনো রিসোর্স পাওয়া যায়নি</p>';
        return;
      }

      keys.forEach(k => {
        const item = allResources[k];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.image || 'https://via.placeholder.com/150'}" alt="${item.name}">
          <div class="card-content">
            <div class="card-title">${item.name}</div>
            <div class="card-footer">
              <span class="coins">🪙 ${item.coins}</span>
              <button class="btn-get" onclick="downloadItem('${k}')">ডাউনলোড</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function downloadItem(itemKey) {
      // টেলিগ্রাম বটে সরাসরি ফাইল নেওয়ার লিঙ্ক
      if (tg) {
        tg.openTelegramLink(`https://t.me/mdadomali320_bot?start=get_${itemKey}`);
      } else {
        window.open(`https://t.me/mdadomali320_bot?start=get_${itemKey}`, '_blank');
      }
    }

    fetchResources();
  </script>
</body>
</html>
